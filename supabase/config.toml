# Eco-Route requests require a signed-in CitiesWalk user. Do not disable JWT
# verification: the Edge Function receives exact location data.
[functions.eco-route]
verify_jwt = true

[functions.rewards-process]
enabled = true
verify_jwt = true
import_map = "./functions/rewards-process/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/rewards-process/index.ts"

[functions.finalize-account-deletion]
enabled = true
verify_jwt = true
import_map = "./functions/finalize-account-deletion/deno.json"
entrypoint = "./functions/finalize-account-deletion/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/rewards-process/*.html" ]
